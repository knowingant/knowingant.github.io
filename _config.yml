title: Michael Luo
author: Michael Luo
email: luomichaelcunhao@gmail.com
description: >
  Michael's personal website.

theme: minima
markdown: kramdown
kramdown:
  math_engine: mathjax

header_pages:
  - index.md
  - citizenship.md
  - handouts.md
  - diaries.md

# Source of the shengji game is excluded from the Jekyll build; the built
# frontend in shengji/ is published as-is (see scripts/build_shengji.sh).
exclude:
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - shengji-src
  - fly.toml

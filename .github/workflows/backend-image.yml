# Builds the shengji backend image (shengji-src/deploy/Dockerfile, repo-root
# context so the prebuilt ./shengji frontend is bundled) and publishes it as
#   ghcr.io/knowingant/shengji:latest   (and :<commit sha>)
# A VM running shengji-src/deploy/vm/compose.yaml pulls that image; see
# shengji-src/DEPLOY.md, "Backend on a VM". Runs on every push to main that
# touches the backend or the built frontend, or by hand from the Actions tab.
name: backend image

on:
  push:
    branches: [main]
    paths:
      - "shengji-src/**"
      - "shengji/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: shengji-src/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shengji:latest
            ghcr.io/${{ github.repository_owner }}/shengji:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[package]
name = "shengji"
version = "0.1.5-beta.25"
authors = ["Robert Ying <rbtying@aeturnalus.com>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
dynamic = ["slog-term"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.6", features = ["ws", "headers"] }
axum-macros = "0.3"
base64 = "0.22"
ctrlc = { version = "3", features = ["termination"] }
futures = { version = "0.3" }
http = "0.2"
jsonwebtoken = "9"
lazy_static = "1.4.0"
mime_guess = "2"
once_cell = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shengji-core = { path = "../core" }
shengji-mechanics = { path = "../mechanics" }
shengji-rating = { path = "../rating" }
shengji-types = { path = "./backend-types" }
thiserror = "1.0"
slog = "2.5"
wasm-rpc-impl = { path = "../wasm-rpc-impl" }
slog-async = "2.5"
slog-bunyan = "2.2"
slog-term = { version = "2.5", optional = true }
storage = { path = "../storage" }
tokio = { version = "1.28", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "time",
    "sync",
    "io-util",
] }
tower-http = { version = "0.4", features = ["fs", "cors"] }
zstd = "0.12"

[dev-dependencies]
axum-test = "13.0"
tower = { version = "0.4", features = ["util"] }

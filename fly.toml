# Fly.io config for the shengji backend (see shengji-src/DEPLOY.md).
#
# The frontend lives on GitHub Pages (https://knowingant.github.io/shengji/);
# this app is only the game server + accounts + ratings API. It also serves
# the prebuilt frontend at / as a fallback.
#
# Before the first deploy (details in shengji-src/DEPLOY.md):
#   ./scripts/build_shengji.sh   # the image COPYs ./shengji and fails without it
#   fly launch --no-deploy --copy-config --name knowingant-shengji
#   fly volumes create shengji_data --size 1 --region sjc   # must match primary_region
#   fly secrets set GOOGLE_CLIENT_ID=<your oauth web client id>   # required: the only sign-in
#   fly deploy

app = "knowingant-shengji"
primary_region = "sjc"

[build]
  dockerfile = "shengji-src/deploy/Dockerfile"

[env]
  STATIC_DIR = "/app/static"
  DATABASE_PATH = "/data/shengji.db"
  DUMP_PATH = "/data/shengji_state.json"
  MESSAGE_PATH = "/data/shengji_messages.json"
  PORT = "3030"
  # Origins allowed to call the API / open websockets. The backend's own
  # origin (same-origin requests) is always allowed.
  CORS_ALLOWED_ORIGINS = "https://knowingant.github.io"
  # Fly terminates TLS and proxies; trust its client-IP header for rate limits.
  TRUST_PROXY_HEADERS = "1"
  SESSION_TTL_DAYS = "180"

[[mounts]]
  source = "shengji_data"
  destination = "/data"

[http_service]
  internal_port = 3030
  force_https = true
  # Websocket rooms live in memory; keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
